# Canonical instrument profiles.
#
# This catalog is intentionally data-driven: the pipeline, notation layer and
# UI all read from it instead of hard-coding names or GM programs.  "range" is
# the sounding MIDI range; "transpose" is the number of semitones added to
# sounding pitch to obtain written pitch (Bb trumpet = +2).
#
# Ethnic instruments use the nearest General MIDI program for playback; they
# are NOT claims that a model can identify that instrument.  For solo input the
# profile supplies range/polyphony/clef; for full mixes the user can reassign a
# detected "Other" track to one of these profiles.

instruments:
  # ----- core six ---------------------------------------------------------
  - id: vocals
    name_en: Voice
    name_zh: 人声
    aliases: [vocal, voice, vocals, 人声, 歌声]
    family: voice
    gm_program: 53
    range: [36, 96]
    max_polyphony: 1
    monophonic: true
    clef: treble
    transpose: 0
    notation: staff
    models: [game, basic_pitch, pitch]

